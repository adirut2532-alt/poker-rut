<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3 กอง กาญ — ห้องเกม (พัดพรีเมียม)</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:'Kanit',sans-serif;
  background:radial-gradient(ellipse at 50% 40%,#1a5c1a 0%,#0d2d0d 70%,#081808 100%);
  color:#fff8e8;height:100%;overflow:hidden;user-select:none;
}
.screen{display:none;width:100vw;height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ── HEADER ── */
.hdr{
  background:rgba(5,20,5,.95);
  border-bottom:1px solid rgba(255,220,80,.25);
  padding:8px 14px;display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.hdr-title{font-size:15px;font-weight:800;color:#f0c040;flex:1;}
.hdr-room{font-size:11px;color:#c8a860;}
.hdr-btn{
  background:rgba(0,0,0,.3);border:1px solid rgba(255,220,80,.2);
  color:#f0c040;border-radius:8px;padding:5px 10px;
  font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
}

/* ── LOBBY ── */
#lobby{padding:20px;gap:14px;align-items:center;overflow-y:auto;}
.lobby-code{
  background:rgba(0,0,0,.4);border-radius:16px;
  padding:16px 24px;border:2px solid rgba(255,220,80,.3);
  text-align:center;width:100%;max-width:360px;
}
.lobby-code-lbl{font-size:11px;color:#c8a860;font-weight:700;letter-spacing:.5px;}
.lobby-code-val{font-size:32px;font-weight:900;color:#f0c040;letter-spacing:4px;}
.players-list{
  background:rgba(0,0,0,.3);border-radius:14px;
  border:1px solid rgba(255,220,80,.2);
  overflow:hidden;width:100%;max-width:360px;
}
.pl-header{
  background:rgba(255,220,80,.15);padding:9px 14px;
  font-size:12px;font-weight:800;color:#f0c040;letter-spacing:.5px;
  display:flex;justify-content:space-between;
}
.pl-item{
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,220,80,.08);
}
.pl-item:last-child{border-bottom:none;}
.pl-av{font-size:24px;}
.pl-name{font-size:14px;font-weight:700;flex:1;}
.pl-badge{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
}
.b-host{background:rgba(32,128,200,.3);color:#60c8ff;}
.b-wait{background:rgba(200,160,40,.2);color:#f0c040;}

/* ── GAME ── */
#game{flex-direction:column;}
.game-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TABLE — โต๊ะวงรีพรีเมียมคาสิโน */
.round-table{
  flex:1;position:relative;display:flex;
  align-items:center;justify-content:center;
  padding:24px 20px;min-height:150px;overflow:hidden;
}
.oval-table{
  position:relative;width:96%;height:88%;
  background:radial-gradient(circle at 50% 45%,#0c4722 0%,#052611 70%,#021308 100%);
  border-radius:140px;
  border:13px solid #3d1a04;
  box-shadow:
    inset 0 0 44px rgba(0,0,0,.8),
    0 12px 36px rgba(0,0,0,.7),
    0 0 0 3px #d4af37;
  display:flex;align-items:center;justify-content:center;
}
.table-center{display:flex;align-items:center;justify-content:center;pointer-events:none;}
.table-felt{display:flex;align-items:center;justify-content:center;background:none;border:none;}
.table-logo{
  font-size:13px;color:rgba(212,175,55,.16);
  font-weight:900;letter-spacing:7px;text-transform:uppercase;
}

/* OPP BOX — กล่องผู้เล่นรอบโต๊ะ */
.opp-box{
  position:absolute;
  background:rgba(15,22,36,.88);border-radius:16px;padding:8px 11px;
  border:1px solid rgba(212,175,55,.22);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:92px;max-width:120px;z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
}
.opp-box.pos-top  {top:-22px;left:50%;transform:translateX(-50%);}
.opp-box.pos-left {left:-12px;top:42%;transform:translateY(-50%);}
.opp-box.pos-right{right:-12px;top:42%;transform:translateY(-50%);}
.opp-box.side{min-width:88px;max-width:104px;}
.opp-av{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,220,80,.3),rgba(200,140,20,.2));
  border:2.5px solid rgba(255,220,80,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.opp-av.sm{width:32px;height:32px;font-size:18px;}
.opp-nm{font-size:11px;font-weight:800;color:#fff8e8;text-align:center;}
.opp-chip{
  display:flex;align-items:center;gap:3px;
  background:rgba(0,0,0,.4);border-radius:7px;padding:2px 7px;
  font-size:11px;font-weight:900;color:#f0c040;
  border:1px solid rgba(255,220,80,.2);
}
.opp-cards-h{display:flex;flex-direction:column;gap:2px;align-items:center;}
.opp-row-h{display:flex;gap:2px;}
.opp-card-h{
  width:16px;height:24px;border-radius:3px;
  background:linear-gradient(145deg,#2a6bd4,#1a4ba0);
  border:1px solid rgba(255,255,255,.25);flex-shrink:0;
}
.opp-cards-v{display:flex;gap:2px;}
.opp-col{display:flex;flex-direction:column;gap:2px;}
.opp-card-v{
  width:12px;height:18px;border-radius:2px;
  background:linear-gradient(145deg,#2a6bd4,#1a4ba0);
  border:1px solid rgba(255,255,255,.2);flex-shrink:0;
}
@keyframes cardShuffle{
  0%{transform:rotate(-4deg) translateY(0);}
  50%{transform:rotate(4deg) translateY(-2px);}
  100%{transform:rotate(-2deg) translateY(1px);}
}
.shuffle{animation:cardShuffle .9s ease-in-out infinite alternate;}
.ready-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#f0a820,#c07010);
  color:#fff;font-size:11px;font-weight:900;
  padding:4px 10px;border-radius:8px;z-index:10;
  box-shadow:0 3px 10px rgba(240,168,32,.6);white-space:nowrap;
}
.table-divider{
  height:2px;flex-shrink:0;position:relative;z-index:30;
  background:linear-gradient(90deg,transparent,rgba(255,220,80,.4),transparent);
}

/* MY HAND */
.my-hand{
  background:linear-gradient(180deg,rgba(5,20,5,.98),rgba(3,12,3,1));
  border-top:2px solid rgba(255,220,80,.3);
  padding:8px 10px;display:flex;flex-direction:column;flex-shrink:0;
  padding-bottom:calc(34px + env(safe-area-inset-bottom,16px));
  position:relative;z-index:30;
}
.my-info{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.my-av{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,220,80,.35),rgba(200,140,20,.25));
  border:2.5px solid rgba(255,220,80,.65);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 2px 10px rgba(255,200,60,.25);flex-shrink:0;
}
.my-nm{font-size:17px;font-weight:900;color:#f0c040;flex:1;}
.my-chip{font-size:13px;color:#ffd86a;font-weight:700;}
.my-left{font-size:12px;color:#c8a860;font-weight:700;margin-left:auto;}

.arr-row{display:flex;align-items:stretch;gap:5px;margin-bottom:4px;}
.row-st{width:26px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.row-chk{
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:rgba(255,255,255,.25);
}
.row-chk.ok{background:rgba(32,200,80,.25);border-color:rgba(32,200,80,.6);color:#40e880;}
.row-lbl{font-size:9px;color:#c8a860;font-weight:700;}

.dz{
  flex:1;display:flex;flex-wrap:wrap;gap:3px;
  background:rgba(0,0,0,.2);border-radius:8px;padding:4px 5px;
  border:1.5px dashed rgba(255,255,255,.1);
  min-height:68px;align-content:flex-start;
  transition:border-color .15s,background .15s;
}
.dz.dz-hover{border-color:rgba(240,192,64,.6)!important;background:rgba(200,160,40,.1)!important;}
.dz.dz-full{border-color:rgba(32,180,80,.4);background:rgba(20,140,60,.08);}
.dz-tag{
  font-size:10px;font-weight:700;
  background:rgba(200,160,40,.25);color:#f0c040;
  border-radius:5px;padding:1px 6px;
  align-self:flex-end;border:1px solid rgba(200,160,40,.3);
  white-space:nowrap;margin-left:auto;
}

.big-card{
  width:54px;height:74px;background:#ffffff;
  border-radius:8px;position:relative;flex-shrink:0;
  font-weight:900;line-height:1;
  border:1px solid rgba(0,0,0,.18);
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  touch-action:none;overflow:hidden;
}
/* เลขมุมซ้ายบน */
.big-card .cr{
  position:absolute;top:5px;left:6px;
  font-size:20px;font-weight:900;line-height:.9;
}
/* ดอกใหญ่กลางการ์ด */
.big-card .cs{
  position:absolute;bottom:6px;right:7px;
  font-size:26px;line-height:1;
}
.big-card.red-card{color:#d11f1f;}
.big-card.black-card{color:#1a1a1a;}
.big-card.dragging-source{opacity:.3;}

.unplaced-area{
  background:rgba(0,0,0,.2);border-radius:10px;padding:5px;
  border:1px dashed rgba(255,220,80,.2);
  display:flex;flex-wrap:wrap;gap:4px;min-height:66px;
  margin-bottom:5px;align-content:flex-start;
}

.validate{
  font-size:11px;font-weight:700;text-align:center;
  padding:4px 8px;border-radius:8px;margin-bottom:4px;
}
.val-ok{background:rgba(32,180,80,.2);color:#40e880;border:1px solid rgba(32,180,80,.3);}
.val-warn{background:rgba(240,160,0,.15);color:#f0c040;border:1px solid rgba(240,160,0,.3);}

.actions{
  display:flex;gap:6px;
  padding-bottom:max(20px,env(safe-area-inset-bottom,20px));
}
.abtn{
  flex:1;padding:10px;border:none;border-radius:10px;
  font-family:'Kanit',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
}
.abtn:active{transform:scale(.96);}
.abtn-auto{background:rgba(255,255,255,.1);color:#fff8e8;border:1px solid rgba(255,255,255,.12);}
.abtn-clear{background:rgba(255,255,255,.07);color:#c8a860;border:1px solid rgba(255,255,255,.08);}
.abtn-ready{
  background:linear-gradient(160deg,#f0a820,#c07010);color:#fff;
  font-size:15px;font-weight:900;flex:2;
  box-shadow:0 4px 0 #804808,0 6px 20px rgba(240,168,32,.4);
}
.abtn-foul{
  background:linear-gradient(160deg,#e84040,#b02020);color:#fff;
  font-size:13px;font-weight:800;flex:2;box-shadow:0 3px 0 #700000;
}

/* WAITING */
.wait-box{
  display:flex;flex-direction:column;align-items:center;
  padding:14px;background:rgba(0,0,0,.35);
  border-radius:14px;gap:6px;
}
.wait-title{font-size:15px;font-weight:800;color:#f0c040;}
.wait-sub{font-size:11px;color:#c8a860;}
.wait-stats{display:flex;gap:10px;width:100%;max-width:300px;margin:8px 0 2px;}
.wait-stat{flex:1;background:rgba(255,220,80,.08);border:1px solid rgba(255,220,80,.18);border-radius:12px;padding:10px 6px;text-align:center;}
.ws-num{font-size:22px;font-weight:900;color:#f0c040;line-height:1.1;}
.ws-lbl{font-size:10px;color:#c8a860;margin-top:3px;font-weight:700;}
@keyframes dot{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}
.dots span{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#f0c040;margin:0 2px;
  animation:dot 1.4s infinite ease-in-out;
}
.dots span:nth-child(2){animation-delay:.2s;}
.dots span:nth-child(3){animation-delay:.4s;}

/* BATTLE */
#battle{padding:0;overflow:hidden;}
.battle-body{flex:1;overflow-y:auto;padding:10px 12px;}
.b-section{
  background:rgba(10,40,10,.8);border-radius:14px;
  padding:10px 12px;margin-bottom:10px;
  border:1px solid rgba(255,220,80,.2);
  opacity:0;transform:scale(.96);
  transition:opacity .35s,transform .35s;
}
.b-section.shown{opacity:1;transform:scale(1);}
.b-title{font-size:14px;font-weight:800;color:#f0c040;text-align:center;margin-bottom:8px;}
.fight-line{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:8px;}
.fight-p{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
.fight-nm{font-size:12px;font-weight:800;text-align:center;color:#f0c040;}
.fight-cards{display:flex;gap:2px;flex-wrap:nowrap;justify-content:center;width:100%;}
.fight-card{
  flex:1 1 0;min-width:0;max-width:36px;aspect-ratio:5/7;
  background:#fff;border-radius:5px;
  position:relative;overflow:hidden;
  font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.3);
  border:1px solid rgba(0,0,0,.2);
}
.fight-card.rc{color:#d11f1f;}
.fight-card.bc{color:#1a1a1a;}
.fight-card .cr{position:absolute;top:2px;left:3px;font-size:13px;line-height:.9;}
.fight-card .cs{position:absolute;bottom:2px;right:3px;font-size:15px;line-height:1;}
.fight-hn{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:rgba(200,160,40,.2);color:#f0c040;border:1px solid rgba(200,160,40,.3);}
.fight-vs{font-size:13px;font-weight:900;color:#f0c040;align-self:center;padding-top:20px;}
.rbadge{font-size:13px;font-weight:800;padding:4px 12px;border-radius:9px;white-space:nowrap;}
.fwin{background:rgba(20,180,80,.25);color:#40e880;border:1px solid rgba(20,180,80,.4);}
.flose{background:rgba(220,32,32,.2);color:#ff6060;border:1px solid rgba(220,32,32,.35);}
.fdraw{background:rgba(200,160,40,.15);color:#f0c040;}

.talu-banner{
  background:rgba(220,32,32,.2);border:2px solid #e03030;
  border-radius:12px;padding:10px 14px;margin:8px 0;
  font-size:15px;font-weight:800;color:#ff8080;text-align:center;
  opacity:0;transform:scale(.85);
  transition:opacity .3s,transform .3s cubic-bezier(.175,.885,.32,1.275);
}
.talu-banner.shown{opacity:1;transform:scale(1);}
.darby-banner{
  background:linear-gradient(135deg,rgba(255,180,30,.28),rgba(255,90,0,.22));
  border:2.5px solid #ffb320;border-radius:14px;
