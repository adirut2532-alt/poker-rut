@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap');

.kang-root{
  --blue:#0A84FF; --blue2:#5AC8FA; --gold:#FFD60A; --gold-dk:#D4A800;
  --ivory:#FFFFFF; --text:#F5F7FA; --muted:rgba(235,240,255,.62);
  --red:#FF453A; --mint:#30D158; --sky:#64D2FF; --violet:#BF5AF2;
  --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.16); --stroke:rgba(255,255,255,.22);
  --font:-apple-system, 'SF Pro Display', 'Kanit', 'Helvetica Neue', sans-serif;
  position:relative; max-width:480px; margin:0 auto; height:100dvh; min-height:640px;
  background:
    radial-gradient(120% 70% at 20% 0%, rgba(90,200,250,.35) 0%, transparent 60%),
    radial-gradient(100% 60% at 90% 100%, rgba(191,90,242,.30) 0%, transparent 60%),
    linear-gradient(180deg,#0B1E3A 0%,#0E2A52 45%,#0B1F3D 100%);
  font-family:var(--font); color:var(--text);
  overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
  display:flex; flex-direction:column;
}
.kang-root *{box-sizing:border-box}
button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}

/* ---- glass primitives ---- */
.glass{background:var(--glass); border:1px solid var(--stroke);
  backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);}
.glossy{position:relative; overflow:hidden;}
.glossy::before{content:""; position:absolute; left:0; right:0; top:0; height:48%;
  background:linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.06)); pointer-events:none;
  border-radius:inherit;}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:6px;
  padding:10px 12px 4px; font-size:11px; color:var(--muted);}
.topbar .room{flex:0 1 auto; min-width:34px; display:flex; align-items:center; gap:5px; background:var(--glass2); border:1px solid var(--stroke);
  border-radius:20px; padding:4px 9px 4px 7px; color:#fff; font-size:11px; white-space:nowrap; overflow:hidden;}
.room-name{overflow:hidden; text-overflow:ellipsis; max-width:70px; color:var(--muted);}
@media (max-width:380px){ .room-name{display:none;} .topbar .room{padding:4px 8px;} }
.topbar .logo{flex:0 0 auto;}
.topbar-right{flex:0 0 auto;}
.topbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--mint); margin-right:6px; box-shadow:0 0 8px var(--mint);}
.logo{font-weight:700;font-size:18px;letter-spacing:-.2px;color:#fff;}
.logo span{color:var(--gold);}
.topbar-right{display:flex; align-items:center; gap:5px;}
.pot{color:#fff; font-weight:600; font-size:12px; padding:4px 8px; border-radius:20px; white-space:nowrap;
  background:var(--glass2); border:1px solid var(--stroke); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.hist-btn{background:var(--glass2); border:1px solid var(--stroke); color:#fff;
  font-size:13px; border-radius:20px; padding:4px 8px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.room{cursor:pointer;}
.room-exit{color:#fff; font-size:12px; font-weight:700;}

/* ---------- lobby ---------- */
.kang-root.lobby{overflow-y:auto; touch-action:pan-y; padding:0 18px calc(24px + env(safe-area-inset-bottom)); gap:14px;}
.lb-hero{text-align:center; padding:44px 0 12px;}
.lb-logo{font-weight:800; font-size:54px; letter-spacing:-1px; line-height:1; color:#fff;
  text-shadow:0 2px 18px rgba(90,200,250,.45);}
.lb-logo span{color:var(--gold);}
.lb-sub{font-size:12px; color:var(--muted); margin-top:8px; letter-spacing:2px; text-transform:uppercase;}
.lb-card{background:var(--glass); border:1px solid var(--stroke); border-radius:22px; padding:16px;
  backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35);}
.lb-label{font-size:12.5px; color:var(--muted); margin:10px 0 8px; font-weight:500;}
.lb-label:first-child{margin-top:0;}
.lb-label b{color:#fff;}
.lb-dim{color:var(--muted); font-size:11px; opacity:.8;}
.lb-input{width:100%; background:rgba(0,0,0,.22); border:1px solid var(--stroke); color:#fff;
  font-family:var(--font); font-size:16px; padding:12px 14px; border-radius:14px; outline:none;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.25);}
.lb-input:focus{border-color:var(--blue2); box-shadow:inset 0 2px 6px rgba(0,0,0,.25), 0 0 0 3px rgba(90,200,250,.25);}
.lb-avatars{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.lb-ava{font-size:24px; background:var(--glass); border:1px solid var(--stroke); border-radius:14px; padding:8px 0;
  transition:transform .12s;}
.lb-ava.on{background:linear-gradient(180deg,#5AC8FA,#0A84FF); border-color:rgba(255,255,255,.5); transform:scale(1.06);
  box-shadow:0 6px 16px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.5);}
.lb-seg{display:flex; gap:8px;}
.lb-seg-btn{flex:1; font-weight:600; font-size:15px; color:#fff;
  background:var(--glass); border:1px solid var(--stroke); border-radius:14px; padding:11px 0;}
.lb-seg-btn.on{background:linear-gradient(180deg,#5AC8FA,#0A84FF); border-color:rgba(255,255,255,.5);
  box-shadow:0 6px 16px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.5);}
.lb-note{font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.6;}
.lb-note b{color:var(--gold);}
.lb-prices{display:flex; flex-direction:column; gap:8px;}
.lb-price-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:8px 10px 8px 12px;}
.lb-price-txt{display:flex; flex-direction:column; line-height:1.25;}
.lb-price-txt b{font-size:14px; color:#fff; font-weight:600;}
.lb-price-txt span{font-size:10.5px; color:var(--muted);}
.lb-stepper{display:flex; align-items:center; gap:4px;}
.lb-stepper button{width:34px; height:34px; border-radius:10px; border:1px solid var(--stroke);
  background:var(--glass2); color:#fff; font-size:18px; line-height:1;}
.lb-stepper input{width:58px; height:34px; text-align:center; background:rgba(0,0,0,.25); border:1px solid var(--stroke);
  border-radius:10px; color:var(--gold); font-family:var(--font); font-weight:700; font-size:15px; outline:none;}
.lb-seats{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:4px 0;}
.lb-seat{text-align:center; font-size:11px; color:var(--muted); width:58px;}
.lb-seat-ava{width:44px;height:44px;margin:0 auto 4px;border-radius:50%; font-size:22px; line-height:42px;
  background:var(--glass); border:1px solid var(--stroke);}
.lb-seat.me .lb-seat-ava{border-color:var(--gold); box-shadow:0 0 14px rgba(255,214,10,.45);}
.lb-seat.me{color:var(--gold);}
.lb-start{position:relative; overflow:hidden; font-weight:700; font-size:18px; color:#fff; margin-top:4px;
  background:linear-gradient(180deg,#5AC8FA 0%,#0A84FF 55%,#0066D6 100%); border:1px solid rgba(255,255,255,.45);
  border-radius:18px; padding:17px 0; box-shadow:0 10px 30px rgba(10,132,255,.45), inset 0 1px 0 rgba(255,255,255,.6);}
.lb-start::before{content:""; position:absolute; left:0; right:0; top:0; height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.05)); border-radius:inherit; pointer-events:none;}
.lb-start:active{transform:scale(.98);}

.lb-practice{display:flex; flex-direction:column; align-items:center; gap:3px; font-weight:600; font-size:15px; color:#fff;
  background:var(--glass); border:1px dashed rgba(255,255,255,.45); border-radius:18px; padding:12px 0;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.lb-practice span{font-size:10.5px; color:var(--muted); font-weight:400;}
.lb-practice:active{transform:scale(.98);}
.practice-chip{background:linear-gradient(180deg,#FFB86B,#FF9F0A); color:#3A2200; font-size:9.5px; font-weight:800;
  border-radius:12px; padding:3px 6px; border:1px solid rgba(255,255,255,.5); white-space:nowrap;}
.hist-btn.on{background:linear-gradient(180deg,#5AC8FA,#0A84FF); border-color:rgba(255,255,255,.5);}
.hint-bar{margin:4px 16px 0; padding:7px 12px; border-radius:12px; font-size:11.5px; line-height:1.45;
  background:rgba(255,159,10,.14); border:1px solid rgba(255,159,10,.35); color:#FFE0B8;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.peek-panel{position:absolute; left:16px; right:16px; top:56px; z-index:35; display:flex; flex-direction:column; gap:5px;
  background:rgba(10,20,40,.72); border:1px solid var(--stroke); border-radius:16px; padding:8px 10px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 12px 30px rgba(0,0,0,.45);}
.peek-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.peek-name{font-size:11px; color:#fff; white-space:nowrap;}
.peek-name b{color:var(--gold); margin-left:3px;}
.peek-cards{display:flex; gap:3px;}

.mem-card{display:flex; align-items:center; gap:12px; padding:14px;}
.mem-ava{width:56px; height:56px; border-radius:50%; font-size:28px; line-height:54px; text-align:center; flex:0 0 auto;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.08)); border:1.5px solid rgba(255,255,255,.55);}
.mem-info{flex:1; min-width:0;}
.mem-name{font-weight:700; font-size:17px; color:#fff;}
.mem-edit{font-size:10.5px; color:var(--blue2); font-weight:500; margin-left:6px; cursor:pointer;}
.mem-stats{display:flex; gap:10px; font-size:11px; color:var(--muted); margin-top:3px; flex-wrap:wrap;}
.mem-stats b{color:#fff;}
.mem-net{font-size:12px; font-weight:700; margin-top:3px;}
.mem-switch{background:var(--glass2); border:1px solid var(--stroke); color:#fff; font-size:12px; font-weight:600;
  border-radius:12px; padding:8px 12px; flex:0 0 auto;}
.mem-list{display:flex; flex-direction:column; gap:8px;}
.mem-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; cursor:pointer;
  background:var(--glass); border:1px solid var(--stroke); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);}
.mem-row:active{background:var(--glass2);}
.mem-row-ava{width:46px; height:46px; border-radius:50%; font-size:24px; line-height:44px; text-align:center;
  background:rgba(255,255,255,.14); border:1px solid var(--stroke);}
.mem-row-info{flex:1; min-width:0;}
.mem-row-name{font-weight:700; font-size:15px; color:#fff;}
.mem-row-sub{font-size:11px; color:var(--muted); margin-top:2px;}
.mem-row-del{background:transparent; border:none; font-size:16px; opacity:.6; padding:6px;}
.lb-input.pin{text-align:center; letter-spacing:10px; font-size:22px; font-weight:700;}
.lb-err{color:#FF8A80; font-size:12px; margin-top:8px;}
.lb-row2{display:flex; gap:8px; margin-top:12px;}
.lb-row2 .ov-btn:disabled{opacity:.4;}

.land-cards{display:flex; flex-direction:column; gap:12px;}
.land-card{display:flex; align-items:center; gap:14px; padding:18px 16px; border-radius:22px; cursor:pointer;
  background:var(--glass); border:1px solid var(--stroke); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  box-shadow:0 10px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .12s;}
.land-card:active{transform:scale(.98);}
.land-card.member{background:linear-gradient(180deg, rgba(90,200,250,.28), rgba(10,132,255,.22)); border-color:rgba(255,255,255,.4);}
.land-ico{width:54px; height:54px; border-radius:16px; font-size:28px; line-height:52px; text-align:center; flex:0 0 auto;
  background:rgba(255,255,255,.16); border:1px solid var(--stroke);}
.land-txt{flex:1; display:flex; flex-direction:column; gap:3px;}
.land-txt b{font-size:17px; font-weight:700; color:#fff;}
.land-txt span{font-size:11.5px; color:var(--muted); line-height:1.4;}
.land-arrow{font-size:26px; color:rgba(255,255,255,.5);}
.land-foot{text-align:center; font-size:11px; color:var(--muted); margin-top:auto; padding-top:20px;}

.win-sum{background:rgba(0,0,0,.25); border:1px solid rgba(255,214,10,.35); border-radius:14px; padding:10px 12px; text-align:left; margin-bottom:6px;}
.win-sum-title{font-weight:700; color:#fff; font-size:12.5px; margin-bottom:6px;}
.win-sum-row{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); padding:2px 0;}
.win-sum-row b{color:#fff; font-weight:600;}
.win-sum-row.total{border-top:1px solid rgba(255,255,255,.18); margin-top:5px; padding-top:6px; color:#fff; font-weight:700;}
.win-sum-row.total b{color:var(--gold); font-size:16px;}
.win-sum-row.fail{color:#FF8A80;} .win-sum-row.fail b{color:#FF8A80;}
.win-sum-row.me{color:#fff; font-weight:600;}
.knock-tag{font-style:normal; margin-left:6px; font-size:10.5px; color:var(--gold); background:rgba(255,214,10,.15); border:1px solid rgba(255,214,10,.35); border-radius:8px; padding:0 6px;}
.win-sum-row em{font-style:normal; color:var(--violet); font-size:11px;}

.rs-title{font-weight:700; font-size:17px; color:#fff; margin-bottom:4px;}
.rs-next-dealer{font-size:11.5px; color:var(--muted); margin:-6px 0 10px;}
.rs-next-dealer b{color:var(--gold);}
.rs-reason{font-size:11.5px; color:var(--muted); margin-bottom:12px; line-height:1.5;}
.rs-table{background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.14); border-radius:14px; overflow:hidden;}
.rs-head, .rs-row{display:grid; grid-template-columns:1fr 84px 84px; align-items:center; padding:9px 12px; text-align:right;}
.rs-head{font-size:10.5px; color:var(--muted); background:rgba(255,255,255,.06); text-transform:uppercase; letter-spacing:.5px;}
.rs-head span:first-child, .rs-row .rs-name{text-align:left;}
.rs-row{border-top:1px solid rgba(255,255,255,.08); font-size:13px;}
.rs-row b{font-weight:700; font-size:14px;}
.rs-row.me{background:rgba(255,255,255,.06);}
.rs-row.top .rs-name{color:var(--gold);}
.rs-name{color:#fff; font-weight:600;}

.net-grid{display:grid; grid-template-columns:1.25fr .8fr .8fr .9fr; align-items:center; gap:4px;
  padding:7px 6px; font-size:12px; text-align:right; border-top:1px solid rgba(255,255,255,.08);}
.net-grid.head{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; border-top:none; padding-bottom:3px;}
.net-grid.me{background:rgba(255,255,255,.06); border-radius:8px;}
.net-grid b{font-weight:600; font-size:12.5px;}
.net-grid b.tot{font-weight:800; font-size:14px;}
.net-name{text-align:left; color:#fff; font-weight:600; display:flex; flex-direction:column; line-height:1.2;}
.net-name em{font-style:normal; color:var(--violet); font-size:10px; font-weight:500;}

.turn-timer{margin-left:8px; font-weight:700; color:#fff; background:rgba(255,255,255,.14); border-radius:10px; padding:1px 7px; font-size:11.5px;}
.turn-timer.urgent{background:var(--red); animation:pulse 1s infinite;}
.seat .ava.away{filter:grayscale(1) brightness(.7); border-style:dashed;}
.pres-badge{position:absolute; left:-6px; top:-6px; font-size:13px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}

.ava-img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
.mem-ava, .mem-row-ava, .lb-seat-ava, .seat .ava{overflow:hidden; display:flex; align-items:center; justify-content:center;}
.seat .ava{overflow:visible;} .seat .ava .ava-img{border-radius:50%;}
.photo-row{display:flex; align-items:center; gap:12px;}
.photo-preview{width:72px; height:72px; border-radius:50%; font-size:36px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.08)); border:2px solid rgba(255,255,255,.55); overflow:hidden; flex:0 0 auto;}
.photo-btns{display:flex; flex-direction:column; gap:6px; flex:1;}
.photo-btns .ov-btn{padding:9px 0; font-size:13px;}
.ava-inline{display:inline-flex; width:20px; height:20px; border-radius:50%; overflow:hidden; vertical-align:middle; font-size:14px; align-items:center; justify-content:center;}

.xfer-row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; padding:8px 4px;
  border-top:1px solid rgba(255,255,255,.08); font-size:12.5px;}
.xfer-row:first-of-type{border-top:none;}
.xfer-row.me{background:rgba(255,255,255,.06); border-radius:8px;}
.xfer-from{text-align:left; color:#FF8A80; font-weight:600;}
.xfer-to{text-align:right; color:var(--mint); font-weight:600;}
.xfer-arrow{color:var(--muted); font-size:11px; white-space:nowrap;}
.xfer-arrow b{color:var(--gold); font-size:14px;}

.room-code{font-size:64px; font-weight:800; letter-spacing:10px; color:var(--gold); line-height:1.1; text-shadow:0 2px 18px rgba(255,214,10,.35); padding-left:10px;}
.wr-list{display:flex; flex-direction:column; gap:6px;}
.wr-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.12);}
.wr-row.me{border-color:rgba(255,214,10,.5);}
.wr-row.empty{opacity:.5; border-style:dashed;}
.wr-row .mem-row-ava{width:38px; height:38px; font-size:20px; line-height:36px;}
.wr-name{flex:1; font-weight:600; font-size:14px; color:#fff;}
.join-row{display:grid; grid-template-columns:1fr 110px; gap:8px; margin-top:10px;}
.join-row .lb-input.pin{font-size:18px; letter-spacing:6px; padding:10px 8px;}
.join-row .ov-btn:disabled, .lb-start:disabled{opacity:.45;}
.friends-card{border-color:rgba(90,200,250,.55); background:linear-gradient(180deg, rgba(90,200,250,.20), rgba(10,132,255,.12));}
.warn-card{font-size:12px; line-height:1.55; color:#FFE0B8; border-color:rgba(255,159,10,.5); background:rgba(255,159,10,.14);}
.warn-card b{color:#fff;}
.lb-practice.on{border-style:solid; border-color:var(--mint); background:rgba(48,209,88,.16);}
.host-off{margin:4px 12px 0; padding:8px 12px; border-radius:12px; font-size:12px; text-align:center; color:#fff;
  background:rgba(255,69,58,.3); border:1px solid rgba(255,69,58,.6); animation:pulse 1.6s infinite;}
.sit-bar{background:rgba(100,210,255,.14); border-color:rgba(100,210,255,.4); color:#DDF4FF;}
.sit-btn{margin-left:6px; background:var(--blue); color:#fff; border:none; border-radius:10px; padding:4px 10px; font-size:12px; font-weight:600;}
.topbar .room.code .room-name{display:inline; color:#fff; font-weight:700; max-width:none;}

/* ---------- table ---------- */
.table-zone{position:relative; padding:6px 8px 0; flex:0 0 auto;}
.felt{position:relative; height:clamp(300px, 42dvh, 370px); border-radius:50% / 44%;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.22) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 45%, #2FA36E 0%, #1E7F52 60%, #176542 100%);
  border:6px solid rgba(255,255,255,.18);
  box-shadow:0 0 0 1px rgba(255,255,255,.25), inset 0 0 60px rgba(0,0,0,.35), 0 20px 50px rgba(0,0,0,.45),
    inset 0 2px 0 rgba(255,255,255,.35);}

.center-piles{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);}
.pile{position:relative; cursor:pointer; transition:transform .15s;}
.pile:active{transform:scale(.95);}
.pile.hot::after{content:""; position:absolute; inset:-7px; border-radius:12px;
  border:2px solid var(--gold); animation:pulse 1.4s infinite; pointer-events:none;}
.pile-label{margin-top:7px; text-align:center; font-size:11px; color:rgba(255,255,255,.85); font-weight:500;}

.kback{border-radius:8px; border:2px solid #fff;
  background:
    linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 50%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.35) 0 16%, transparent 17%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 3px, transparent 3px 8px),
    linear-gradient(160deg,#2F6FE0,#163C8F);
  box-shadow:0 3px 10px rgba(0,0,0,.4);}

.chain-tag{position:absolute; left:50%; top:72%; transform:translateX(-50%);
  font-size:11px; color:#fff; background:rgba(255,255,255,.14); border:1px solid var(--stroke);
  padding:3px 11px; border-radius:20px; white-space:nowrap; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.chain-tag b{color:var(--sky);}

/* ---------- animations ---------- */
.fly{position:absolute; left:50%; top:46%; z-index:20; opacity:0;
  transform:translate(-50%,-50%);
  animation:flyTo .42s cubic-bezier(.3,.6,.4,1) forwards;}
.fly.fast{animation-duration:.34s;}
@keyframes flyTo{
  0%{left:50%; top:46%; opacity:1; transform:translate(-50%,-50%) rotate(0deg) scale(1);}
  85%{opacity:1;}
  100%{left:var(--tl); top:var(--tt); opacity:0;
    transform:translate(-50%,-50%) rotate(300deg) scale(.55);}
}
.deal-in{animation:dealIn .3s ease-out backwards;}
@keyframes dealIn{from{opacity:0; margin-bottom:40px;}to{opacity:1; margin-bottom:0;}}

.floater{position:absolute; transform:translate(-50%,-50%); z-index:25;
  font-weight:700; font-size:15px; pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,.9); animation:rise 1.3s ease-out forwards;}
@keyframes rise{from{opacity:1; margin-top:0;}to{opacity:0; margin-top:-34px;}}

/* ---------- seats ---------- */
.seat{position:absolute; transform:translate(-50%,-50%); text-align:center; width:64px; z-index:3;}
.seat .ava{width:44px;height:44px;margin:0 auto;border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.08)); border:1.5px solid rgba(255,255,255,.55);
  font-size:22px; line-height:40px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 12px rgba(0,0,0,.35); transition:box-shadow .2s, transform .2s;}
.seat.active .ava{border-color:var(--gold); box-shadow:0 0 0 4px rgba(255,214,10,.35), 0 0 18px rgba(255,214,10,.5); transform:scale(1.08);}
.seat-name{font-size:10.5px; margin-top:4px; font-weight:600; color:#fff;
  background:rgba(0,0,0,.35); border-radius:10px; padding:1px 7px; display:inline-block;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.seat-cards{font-size:10px; color:rgba(255,255,255,.8); margin-top:2px;}
.seat .ava{position:relative; overflow:visible;}
.card-badge{position:absolute; right:-6px; top:-6px; min-width:20px; height:20px; padding:0 5px; border-radius:10px;
  background:linear-gradient(180deg,#FFFFFF,#DDE4F0); color:#102040; font-size:11.5px; font-weight:800; line-height:20px;
  text-align:center; border:1.5px solid rgba(255,255,255,.9); box-shadow:0 2px 6px rgba(0,0,0,.4);}
.card-badge.low{background:linear-gradient(180deg,#FF8A80,#FF453A); color:#fff; border-color:#FFD2CE; animation:pulse 1.4s infinite;}
.sc-pos{color:var(--mint);} .sc-neg{color:#FF8A80;}
.dealer-chip{display:inline-block; background:var(--gold); color:#3A2E00; font-size:8.5px; font-weight:800;
  border-radius:6px; padding:0 4px; margin-right:4px; vertical-align:middle;}
.dealer-chip.me{font-size:9.5px; padding:1px 5px; margin-right:6px;}

/* ---------- throw piles ---------- */
.pile-anchor{position:absolute; transform:translate(-50%,-50%); z-index:2;}
.tpile{position:relative; min-width:30px; min-height:42px; cursor:pointer;}
.tpile-empty{width:38px;height:54px;border:1.5px dashed rgba(255,255,255,.35);border-radius:6px;}
.tpile-cards{display:flex;}
.tpile-card{position:relative;}
.tpile-card.top .kcard{box-shadow:0 0 0 2px rgba(255,255,255,.95), 0 6px 14px rgba(0,0,0,.55); transform:translateY(-3px) scale(1.06);}
.tpile-n{position:absolute; left:50%; bottom:-15px; font-weight:600; transform:translateX(-50%);
  font-size:9px; color:rgba(255,255,255,.8); white-space:nowrap;}

/* ---------- melds ---------- */
.melds{display:flex; gap:10px; overflow-x:auto; padding:8px 16px 2px; min-height:56px;
  flex:0 0 auto; scrollbar-width:none;}
.melds::-webkit-scrollbar{display:none}
.melds-empty{font-size:11.5px; color:var(--muted); align-self:center; margin:0 auto;}
.meld{flex:0 0 auto; background:var(--glass); border:1px solid var(--stroke); border-radius:14px; padding:7px 10px 8px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
.meld-type{font-size:10px; color:var(--gold); margin-bottom:5px; font-weight:600;}
.meld-cards{display:flex;}
.meld-card{position:relative;}

/* ---------- status ---------- */
.status{display:flex; justify-content:space-between; align-items:center;
  padding:2px 18px; font-size:12px; font-weight:500;}
.st-you{color:var(--mint);} .st-you b{color:var(--gold);}
.st-act{color:var(--gold);} .st-wait{color:var(--muted);}
.st-pts{color:var(--muted); font-size:11px;}

/* ---------- cards ---------- */
.hand{position:relative; flex:1 1 auto; min-height:150px; touch-action:none;}
.kcard{position:relative; border-radius:10px;
  background:linear-gradient(180deg,#FFFFFF 0%,#F4F6FA 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 6px 16px rgba(0,0,0,.35);
  transition:transform .14s, box-shadow .14s, bottom .14s; cursor:pointer; overflow:visible;}
.kcard.lifted{transform:translateY(-20px) !important;
  box-shadow:0 0 0 2.5px var(--blue2), 0 14px 26px rgba(0,0,0,.5);}
.kcard.dragging{transform:translateY(-12px) scale(1.07) !important;
  box-shadow:0 0 0 2.5px var(--mint), 0 16px 26px rgba(0,0,0,.55);}
.kcard.flowable{box-shadow:0 0 0 2.5px var(--sky), 0 8px 16px rgba(0,0,0,.4);}
.kc-rank{position:absolute; top:6%; left:10%; font-weight:800; line-height:1; letter-spacing:-.5px;}
.kc-big{position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); line-height:1;}
.kc-big.joker{top:52%;}
.kc-as{position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
  background:var(--violet); color:#fff; font-size:8.5px; font-weight:700;
  border-radius:8px; padding:1px 6px; white-space:nowrap; z-index:2;}
.meld-hint{position:absolute; top:-4px; left:50%; transform:translateX(-50%);
  font-size:11px; color:var(--mint); white-space:nowrap; font-weight:500;}
.meld-hint.warn{color:#FFB74D;}

/* ---------- floating buttons ---------- */
.flow-btn{position:absolute; left:16px; bottom:176px; z-index:5; overflow:hidden;
  font-weight:700; font-size:13.5px; color:#fff;
  background:linear-gradient(180deg,#8BE0FF,#32ADE6 55%,#1D8FC7); border:1px solid rgba(255,255,255,.5);
  border-radius:24px; padding:11px 16px; box-shadow:0 8px 20px rgba(50,173,230,.45), inset 0 1px 0 rgba(255,255,255,.6);}
.flow-btn:active{transform:scale(.95);}

.kang-btn{position:absolute; right:16px; bottom:174px; width:66px; height:66px; overflow:hidden;
  border-radius:50%; border:1px solid rgba(255,255,255,.55);
  font-weight:800; font-size:18px; color:#3A2E00;
  background:linear-gradient(180deg,#FFF0A3 0%,#FFD60A 50%,#E0B400 100%);
  box-shadow:0 8px 24px rgba(255,214,10,.4), inset 0 1px 0 rgba(255,255,255,.7);
  opacity:.4; transition:opacity .2s, transform .15s; z-index:5;}
.kang-btn::before{content:""; position:absolute; left:10%; right:10%; top:6%; height:42%; border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.05)); pointer-events:none;}
.kang-btn.ready{opacity:1; animation:pulse 1.6s infinite;}
.kang-btn:active{transform:scale(.93);}

/* ---------- action bar ---------- */
.actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom)); flex:0 0 auto;}
.act{position:relative; overflow:hidden; font-weight:600; font-size:15.5px; color:#fff;
  background:var(--glass2); border:1px solid var(--stroke); border-radius:16px; padding:14px 0;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .1s, opacity .2s;}
.act::before{content:""; position:absolute; left:0; right:0; top:0; height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.02)); pointer-events:none;}
.act:active{transform:scale(.97);}
.act:disabled{opacity:.3;}
.act.gold{background:linear-gradient(180deg,#5AC8FA,#0A84FF 55%,#0066D6); border-color:rgba(255,255,255,.5);
  box-shadow:0 8px 20px rgba(10,132,255,.45), inset 0 1px 0 rgba(255,255,255,.6);}
.act.red{background:linear-gradient(180deg,#FF7B72,#FF453A 55%,#D9342A); border-color:rgba(255,255,255,.45);
  box-shadow:0 8px 20px rgba(255,69,58,.35), inset 0 1px 0 rgba(255,255,255,.55);}

/* ---------- toast / overlays ---------- */
.toast{position:absolute; left:50%; bottom:224px; transform:translateX(-50%);
  background:rgba(20,30,50,.75); color:#fff; border:1px solid var(--stroke);
  font-size:13px; font-weight:500; padding:9px 18px; border-radius:24px; z-index:30;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 8px 20px rgba(0,0,0,.35); white-space:nowrap; max-width:92%;}
.overlay{position:absolute; inset:0; background:rgba(5,12,28,.55); z-index:40;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);}
.overlay.shake{animation:shake .45s;}
.ov-card{width:88%; max-width:340px; max-height:88%; overflow-y:auto;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); border-radius:24px; padding:20px 18px; text-align:center;
  backdrop-filter:blur(30px) saturate(170%); -webkit-backdrop-filter:blur(30px) saturate(170%);
  box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.45);}
.ov-card.wide{width:92%; max-width:400px;}
.ov-title{font-weight:700; font-size:20px; margin-bottom:14px; color:#fff;}
.ov-title.small{font-size:16px;}
.ov-title.win{color:var(--gold); text-shadow:0 0 16px rgba(255,214,10,.5);}
.ov-title.fail{color:#FF7B72; text-shadow:0 0 16px rgba(255,69,58,.5);}

.ov-hands{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
.ov-hand{padding:9px 11px 10px; background:rgba(0,0,0,.22); border-radius:14px; border:1px solid rgba(255,255,255,.12);
  opacity:.3; transition:opacity .3s, border-color .3s; text-align:left;}
.ov-hand.show{opacity:1;}
.ov-hand.me{border-color:rgba(255,255,255,.35);}
.ov-hand.winner{border-color:var(--gold); background:rgba(255,214,10,.12);}
.ov-hand-head{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:6px;}
.ov-hand-head b{color:var(--gold);}
.ov-hand-cards{display:flex; flex-wrap:wrap; gap:4px;}

.viewer-grid{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:14px;}

.ov-note{font-size:12px; color:var(--muted); margin-bottom:14px; line-height:1.7;}
.ov-note b{color:var(--gold);}
.ov-btn{position:relative; overflow:hidden; font-weight:700; font-size:15px; width:100%; color:#fff;
  background:linear-gradient(180deg,#5AC8FA,#0A84FF 55%,#0066D6); border:1px solid rgba(255,255,255,.5);
  border-radius:16px; padding:13px 0; box-shadow:0 8px 20px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.6);}
.ov-btn::before{content:""; position:absolute; left:0; right:0; top:0; height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,.04)); pointer-events:none;}
.ov-btn.dark{background:var(--glass2); color:#fff; border:1px solid var(--stroke); box-shadow:none;}

.hist-list{display:flex; flex-direction:column; gap:8px; margin-bottom:4px; max-height:62vh; overflow-y:auto;}
.hist-row{background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:8px 11px;}
.hist-who{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.hist-face{font-size:16px;}
.hist-name{font-size:12px; font-weight:600;}
.hist-badge{font-size:10px; background:rgba(255,214,10,.18); color:var(--gold); border:1px solid rgba(255,214,10,.3);
  border-radius:10px; padding:1px 7px; font-weight:600;}
.hist-cards{display:flex; flex-wrap:wrap; gap:4px;}

/* ---------- confetti / keyframes ---------- */
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.confetti span{position:absolute; top:-12px; width:8px; height:13px; border-radius:2px;
  animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,.55);}
  50%{box-shadow:0 0 0 10px rgba(255,214,10,0);}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* =============== \u0E1B\u0E23\u0E31\u0E1A\u0E42\u0E09\u0E21 v3: \u0E43\u0E2B\u0E0D\u0E48 \u0E0A\u0E31\u0E14 \u0E01\u0E14\u0E07\u0E48\u0E32\u0E22 \u0E17\u0E38\u0E01\u0E27\u0E31\u0E22 =============== */
.kang-root{min-height:0;}
.felt{height:clamp(190px, 38dvh, 360px);}
.topbar{padding:10px 12px 4px;}
.logo{font-size:20px;}
.pot{font-size:13.5px; padding:6px 12px;}
.menu-btn{font-size:14px; font-weight:700; padding:6px 13px;}
.topbar .room{font-size:13px; padding:6px 11px 6px 9px;}
.seat{width:80px;}
.seat .ava{width:52px; height:52px; font-size:27px; line-height:48px;}
.seat-name{font-size:12.5px; padding:2px 9px; margin-top:5px;}
.seat-cards{font-size:12px; margin-top:3px;}
.seat-cards b{background:rgba(0,0,0,.4); border-radius:9px; padding:1px 7px;}
.card-badge{min-width:23px; height:23px; line-height:23px; font-size:13px; right:-7px; top:-7px;}
.pile-label{font-size:13px; font-weight:600;}
.chain-tag{font-size:13px; padding:5px 13px; font-weight:600;}
.tpile-n{font-size:10.5px;}
.melds{min-height:0; padding:8px 14px 0;}

.turn-banner{margin:8px 12px 0; padding:10px 14px; border-radius:18px; text-align:center;
  background:rgba(255,255,255,.10); border:1px solid var(--stroke);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
.turn-banner.mine{background:linear-gradient(180deg, rgba(48,209,88,.38), rgba(48,209,88,.18)); border-color:rgba(48,209,88,.8);
  animation:minePulse 1.6s infinite;}
.tb-main{font-size:16.5px; font-weight:700; color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; line-height:1.3;}
.tb-main b{color:var(--gold);}
.tb-main .turn-timer{margin-left:0; font-size:14px; padding:2px 9px;}
.tb-bar{height:6px; border-radius:3px; background:rgba(0,0,0,.28); margin-top:8px; overflow:hidden;}
.tb-bar i{display:block; height:100%; width:100%; border-radius:3px; background:linear-gradient(90deg,#FF453A,#FFD60A 35%,#30D158);
  transform-origin:left center; animation:tbShrink linear forwards;}
@keyframes tbShrink{from{transform:scaleX(1);}to{transform:scaleX(0);}}
@keyframes minePulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.5);}50%{box-shadow:0 0 0 9px rgba(48,209,88,0);}}
.info-row{display:flex; justify-content:center; align-items:center; gap:7px; padding:8px 12px 0; flex-wrap:wrap;}
.info-row .chip{font-size:13.5px; font-weight:700; color:#fff; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.16);
  border-radius:14px; padding:4px 12px;}
.info-row .chip.pts{color:var(--gold);}
.info-row .chip.pos{color:var(--mint);} .info-row .chip.neg{color:#FF8A80;}
.info-row .chip.dealer{background:var(--gold); color:#3A2E00; border-color:transparent;}
.hint-bar{font-size:13px; margin-top:8px;}

.hand{min-height:122px;}
.meld-hint{font-size:12.5px; top:-2px;}
.mate-btn{white-space:nowrap; flex:0 0 auto;
  font-size:13.5px; font-weight:700; color:#fff; background:linear-gradient(180deg,#5AC8FA,#0A84FF); border:1px solid rgba(255,255,255,.5);
  border-radius:18px; padding:7px 14px; box-shadow:0 6px 16px rgba(10,132,255,.45);}

.actions{grid-template-columns:1.25fr .85fr 1.25fr; gap:10px; padding:8px 12px calc(14px + env(safe-area-inset-bottom));}
.act{font-size:17.5px; font-weight:700; padding:17px 0; border-radius:18px;}
.act:disabled{opacity:.28;}
.act.primary{background:linear-gradient(180deg,#5AC8FA,#0A84FF 55%,#0066D6); border-color:rgba(255,255,255,.55);
  box-shadow:0 8px 22px rgba(10,132,255,.5), inset 0 1px 0 rgba(255,255,255,.6); animation:actPulse 1.5s infinite;}
.act.red{background:var(--glass2); border-color:var(--stroke); box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4);}
.act.red.primary{background:linear-gradient(180deg,#FF7B72,#FF453A 55%,#D9342A); border-color:rgba(255,255,255,.5);
  box-shadow:0 8px 22px rgba(255,69,58,.45), inset 0 1px 0 rgba(255,255,255,.55);}
@keyframes actPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
.kang-btn{width:76px; height:76px; bottom:186px; right:14px; font-size:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05;}
.kang-btn small{font-size:10.5px; font-weight:800; opacity:.75; margin-top:2px; position:relative;}
.flow-btn{font-size:15.5px; padding:14px 18px; bottom:196px; left:14px; animation:actPulse 1.3s infinite;}
.toast{font-size:14.5px; bottom:258px; white-space:normal; text-align:center; padding:10px 18px; line-height:1.4;}

.ov-title{font-size:21px;} .ov-title.small{font-size:17.5px;}
.ov-note{font-size:13px;} .ov-btn{font-size:16px; padding:15px 0;}
.win-sum-title{font-size:13.5px;} .win-sum-row{font-size:13px;}
.net-grid{font-size:13px;} .net-grid b{font-size:13.5px;} .net-grid b.tot{font-size:15px;}
.rs-title{font-size:18px;} .rs-reason{font-size:12.5px;} .rs-row{font-size:14.5px;} .rs-row b{font-size:15px;}
.ov-hand-head{font-size:14px;} .xfer-row{font-size:13.5px;}
.menu-list{display:flex; flex-direction:column; gap:8px;}
.menu-item{display:flex; align-items:center; gap:13px; text-align:left; width:100%; padding:13px 14px; border-radius:16px;
  background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.14); color:#fff; font-size:16px; font-weight:700;}
.menu-item:active{background:rgba(255,255,255,.14);}
.menu-item span{font-size:24px; width:30px; text-align:center;}
.menu-item small{display:block; font-size:12px; font-weight:400; color:var(--muted); margin-top:1px;}
.menu-item.danger{color:#FF8A80;}
.rules{text-align:left; font-size:14px; line-height:1.6; color:var(--text);}
.rules h4{margin:12px 0 4px; color:var(--gold); font-size:14.5px;}
.rules h4:first-child{margin-top:0;}
.rules ul{margin:0; padding-left:20px;} .rules li{margin:2px 0;} .rules b{color:#fff;}
.land-rules{font-size:15px; font-weight:600; color:#fff; background:transparent; border:1px solid var(--stroke); border-radius:16px; padding:13px 0; margin-top:4px;}
.lb-label{font-size:13.5px;} .lb-seg-btn{font-size:16px; padding:12px 0;} .lb-note{font-size:12.5px;}
.land-txt b{font-size:18px;} .land-txt span{font-size:12.5px;}
.table-zone{padding-top:22px;}
.felt{height:clamp(170px, 34dvh, 350px);}
.ov-card{touch-action:pan-y; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
.sticky-btn{position:sticky; bottom:-4px; z-index:3; box-shadow:0 -10px 18px rgba(12,22,44,.85), 0 8px 20px rgba(10,132,255,.4);}
.table-zone{padding-top:28px;}
.kang-btn{bottom:238px;}
.flow-btn{bottom:246px;}
@media (max-height:600px){ .hint-bar:not(.sit-bar){display:none;} .table-zone{padding-top:30px;} .felt{height:172px;} .info-row{display:none;} .turn-banner{padding:7px 12px; margin-top:6px;} .tb-main{font-size:15px;} .act{padding:13px 0;} .kang-btn{bottom:186px; width:56px; height:56px; font-size:16px;} .kang-btn small{font-size:9px; margin-top:0;} .flow-btn{bottom:192px; padding:10px 14px; font-size:14px;} .toast{bottom:250px;} .kang-btn:not(.ready){display:none;} }
